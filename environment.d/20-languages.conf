# for rust
CARGO_HOME="$XDG_SDK_HOME/cargo"
RUSTUP_HOME="$XDG_SDK_HOME/rustup"
RUST_BACKTRACE=full
# for deno
DENO_DIR="$XDG_STATE_HOME/deno"
DENO_INSTALL="$XDG_SDK_HOME/deno"
DENO_INSTALL_ROOT="$XDG_SDK_HOME/deno"
DENO_REPL_HISTORY="$DENO_DIR/history.txt"
DENO_NO_UPDATE_CHECK=true
NPM_CONFIG_REGISTRY="https://registry.npmmirror.com"
# for python
JUPYTER_DATA_DIR="$XDG_CONFIG_HOME/jupyter"
IPYTHONDIR="$JUPYTER_DATA_DIR"
JUPYTER_CONFIG_DIR="$JUPYTER_DATA_DIR"
PYTHONSTARTUP="$XDG_CONFIG_HOME/pip/startup.py"
MPLCONFIGDIR="$XDG_STATE_HOME/matplotlib"
#? uv
UV_PYTHON_PREFERENCE="only-managed"
#? nodejs
NPM_CONFIG_USERCONFIG="$XDG_CONFIG_HOME/npmrc"
NODE_REPL_HISTORY="$XDG_STATE_HOME/npm_history"
npm_config_cache="$XDG_CACHE_HOME/npm"
#? java
JAVA_VERSION="25.0.2+10"
JAVA_HOME="$XDG_SDK_HOME/jdk/jdk-$JAVA_VERSION"
