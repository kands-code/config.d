KDEHOME="$XDG_CONFIG_HOME/kde"
CONFIGHOME="$HOME/projects/github/config.d"
# java config
_JAVA_OPTIONS="-Djava.util.prefs.userRoot=$XDG_STATE_HOME/java -Djavafx.cachedir=$XDG_STATE_HOME/openjfx"
# dotnet config
DOTNET_ROOT="$HOME/.dotnet/sdk"
DOTNET_CLI_HOME="$HOME/.dotnet/caches"
DOTNET_CLI_TELEMETRY_OPTOUT=1
DOTNET_GENERATE_ASPNET_CERTIFICATE=0
NUGET_PACKAGES="$XDG_DATA_HOME/NuGet/packages"
NUGET_HTTP_CACHE_PATH="$XDG_DATA_HOME/NuGet/v3-cache"
