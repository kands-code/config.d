[Resolve]
# use cf dns and quad9 dns as main dns
DNS=1.1.1.2#security.cloudflare-dns.com 1.0.0.2#security.cloudflare-dns.com 9.9.9.11#dns11.quad9.net 9.9.9.9#dns.quad9.net
# use ali dns as fallback
FallbackDNS=223.5.5.5#dns.alidns.com 2400:3200::1 223.6.6.6#dns.alidns.com 2400:3200:baba::1
Domains=~.
DNSSEC=true
# try use DoT by default
DNSOverTLS=yes
# use systemd-resolved for mDNS
MulticastDNS=yes
LLMNR=yes
Cache=no-negative
CacheFromLocalhost=yes
DNSStubListener=yes
#DNSStubListenerExtra=
ReadEtcHosts=yes
ResolveUnicastSingleLabel=yes
StaleRetentionSec=2
