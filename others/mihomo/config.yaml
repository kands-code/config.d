# ============================================================
# Mihomo 标准配置
# 说明文档: https://wiki.metacubex.one/config/
# 规则架构: proxy-providers 只管节点，rule-providers 管外部规则集，
#           rules 只决定匹配后的走向。
# ============================================================

# -------------------- 端口与基础行为 --------------------

# HTTP(S) 代理端口（如需使用可取消注释）
# port: 7899
# SOCKS5 代理端口（如需使用可取消注释）
# socks-port: 7898
# HTTP(S) 与 SOCKS 混合代理端口
mixed-port: 19580
# 透明代理端口（如需使用可取消注释）
# redir-port: 7895
# Linux 透明代理 TProxy 端口（如需使用可取消注释）
# tproxy-port: 7896

# 匹配模式：rule（规则）/ global（全局）/ direct（直连）
mode: rule
# 日志等级：silent / error / warning / info / debug
log-level: warning
# 允许局域网设备连接本代理
allow-lan: true
# 绑定地址，* 表示所有网卡
bind-address: "*"
# 是否开启 IPv6 总开关，关闭会阻断 IPv6 并屏蔽 AAAA 记录
ipv6: true
# 统一延迟测试口径，避免不同测试 URL 导致延迟不可比
unified-delay: true
# 对同一目标并发连接使用同一节点
tcp-concurrent: true
# 进程匹配模式：always / strict / off
find-process-mode: strict

# -------------------- 地理数据自动更新 --------------------
# 自定义 geodata 下载地址；本地无文件时启动自动下载，
# 开启 geo-auto-update 后按间隔自动更新。
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
# 是否自动更新 geodata
geo-auto-update: true
# geodata 更新间隔，单位：小时
geo-update-interval: 24

# -------------------- API 控制与 WebUI --------------------
# RESTful API 监听地址；仅本机可访问，避免远程控制风险
external-controller: 127.0.0.1:19581
# API 访问密钥，请务必修改为强随机值
# 查询示例:
# curl -H "Authorization: Bearer <secret>" http://127.0.0.1:19581/proxies
secret: ""
# 本地 WebUI 目录；首次启动会从 external-ui-url 自动下载并解压，
# 之后访问 http://127.0.0.1:19581/ui/ 即可管理。
external-ui: /opt/homebrew/etc/mihomo/ui
# WebUI 下载地址（支持 zip / tgz）
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
# 持久化 select 策略组的选中节点，重启后仍保留
profile:
  store-selected: true

# -------------------- TUN 虚拟网卡 --------------------
tun:
  enable: true
  stack: system
  # device: utun1024
  auto-detect-interface: true
  auto-route: true
  strict-route: true
  mtu: 1500
  dns-hijack:
    - any:53

# -------------------- DNS 域名解析 --------------------
dns:
  enable: true
  prefer-h3: false
  listen: ":53"
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.arpa"
    - "+.home.arpa"
    - "+.internal"
    - "+.localhost"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "+.time.apple.com"
    - "+.localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.ipv6.microsoft.com"
    - "+.connectivitycheck.gstatic.com"
    - "+.connectivitycheck.android.com"
    - "+.captive.apple.com"
    - ping.archlinux.org
    - "+.connectivity-check.ubuntu.com"
    - "+.nmcheck.gnome.org"
    - "+.network-check.kde.org"
    - detectportal.firefox.com
    - cp.cloudflare.com
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.2
  nameserver:
    - https://security.cloudflare-dns.com/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://security.cloudflare-dns.com/dns-query
  direct-nameserver: []
  direct-nameserver-follow-policy: false
  fallback:
    - tls://1.1.1.2:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
    domain:
      - +.google.com
      - +.facebook.com
      - +.youtube.com
  nameserver-policy:
    "+.lan":
      - system
    "+.local":
      - system
    "+.home.arpa":
      - system
    "+.internal":
      - system
    "geosite:cn,private,microsoft@cn,apple-cn,steam@cn,google-cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  respect-rules: true
  use-hosts: false
  use-system-hosts: false

# -------------------- 代理节点来源 --------------------
# proxy-providers 只负责下载和更新节点，不提供规则或策略组。
# 使用 Clash Verge UA 是为了让机场返回完整 Clash YAML；
# 若使用 mihomo 默认 UA，部分机场会返回 base64 节点列表。
proxy-providers:
  airport:
    type: http
    url: "YOUR_SUB_URL"
    interval: 3600
    path: ./subscriptions/airport.yaml
    header:
      User-Agent:
        - "clash-verge/v2.5.2"
    health-check:
      enable: true
      interval: 600
      url: https://cp.cloudflare.com/generate_204

# -------------------- 代理策略组 --------------------
# 节点来自 airport provider；自动选择/故障转移只使用节点，
# 不会把信息展示型节点排除。
proxy-groups:
  - name: YOUR_SUB_NAME
    type: select
    use:
      - airport
    proxies:
      - 自动选择
      - 故障转移
  - name: 自动选择
    type: url-test
    use:
      - airport
    url: https://www.gstatic.com/generate_204
    interval: 7200
  - name: 故障转移
    type: fallback
    use:
      - airport
    url: https://www.gstatic.com/generate_204
    interval: 960

# -------------------- 外部规则集 --------------------
# rule-providers 只负责下载和维护规则集；是否生效、生效顺序由
# 下面的 rules 段决定。优先使用 MRS 格式与 JSDelivr CDN。
rule-providers:
  private:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"
    path: ./rule-providers/private.mrs
    interval: 86400
  category-ads-all:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.mrs"
    path: ./rule-providers/category-ads-all.mrs
    interval: 86400
  cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"
    path: ./rule-providers/cn.mrs
    interval: 86400
  cn_ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"
    path: ./rule-providers/cn_ip.mrs
    interval: 86400

# -------------------- 流量规则 --------------------
# 顺序即优先级；先自定义例外，再广告/私网/国内，最后代理兜底。
rules:
  - "DOMAIN-SUFFIX,apple.com.cn,DIRECT"
  - "DOMAIN-SUFFIX,apple-dns.cn,DIRECT"
  - "DOMAIN,weather-kit.apple.com,DIRECT"
  - "DOMAIN,weather-map2.apple.com,DIRECT"
  - "DOMAIN,weather-analytics-events.apple.com,DIRECT"
  - "DOMAIN-SUFFIX,ls.apple.com,DIRECT"
  - "DOMAIN-KEYWORD,apple,YOUR_SUB_NAME"
  - "DOMAIN-SUFFIX,icloud.com,YOUR_SUB_NAME"
  - "DOMAIN-SUFFIX,modrinth.com,YOUR_SUB_NAME"
  - "DOMAIN-SUFFIX,skyvpnx.com,YOUR_SUB_NAME"
  - "DOMAIN-SUFFIX,fawnnode.xyz,YOUR_SUB_NAME"
  - "DOMAIN-SUFFIX,immersivetranslate.com,YOUR_SUB_NAME"
  - RULE-SET,category-ads-all,REJECT
  - RULE-SET,private,DIRECT
  - RULE-SET,cn,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - RULE-SET,cn_ip,DIRECT
  - MATCH,YOUR_SUB_NAME
