# Configuration file for NetworkManager.
# See "man 5 NetworkManager.conf" for details.
[main]
auth-polkit=true
dhcp=internal
hostname-mode=default
dns=systemd-resolved
rc-manager=file
systemd-resolved=true
firewall-backend=iptables

[connection]
down-on-poweroff=yes
llmnr=yes
mdns=yes
dns-over-tls=yes

[connectivity]
enabled=false
