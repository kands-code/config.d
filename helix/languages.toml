[[language]]
name = "c"
language-servers = ["clangd"]
formatter = { command = "clang-format" }
auto-format = true

[[language]]
name = "cpp"
language-servers = ["clangd"]
formatter = { command = "clang-format" }
auto-format = true

# 需要安装 typescript
[language-server.tsc]
command = "tsc"
args = ["--lsp", "--stdio"]

[language-server.tsc.config.typescript]
format.enabled = false
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[language-server.tsc.config.javascript]
format.enabled = false
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[language-server.tsc.config.tsx]
format.enabled = false
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[language-server.tsc.config.jsx]
format.enabled = false
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[[language]]
name = "javascript"
language-servers = ["tsc"]
formatter = { command = "prettier", args = ["--parser", "babel"] }
auto-format = true

[[language]]
name = "jsx"
language-servers = ["tsc"]
formatter = { command = "prettier", args = ["--parser", "babel"] }
auto-format = true

[[language]]
name = "typescript"
language-servers = ["tsc"]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "tsx"
language-servers = ["tsc"]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
auto-format = true

# 安装命令
# npm install --global https://github.com/kands-code/vscode-language-servers/archive/refs/tags/1.141.0.tar.gz
[[language]]
name = "html"
language-servers = ["vscode-html-language-server"]
formatter = { command = "prettier", args = ["--parser", "html"] }
auto-format = true

[[language]]
name = "css"
language-servers = ["vscode-css-language-server"]
formatter = { command = "prettier", args = ["--parser", "css"] }
auto-format = true

[[language]]
name = "json"
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--parser", "json"] }
auto-format = true

[[language]]
name = "jsonc"
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--parser", "jsonc"] }
auto-format = true

[[language]]
name = "python"
language-servers = ["ty", "ruff"]
formatter = { command = "ruff", args = ["format", "-"] }
auto-format = true

[[language]]
name = "rust"
language-servers = ["rust-analyzer"]
formatter = { command = "rustfmt" }
auto-format = true

# 需要单独安装 tinymist
[language-server.tinymist]
command = "tinymist"

[language-server.tinymist.config]
fontPaths = ["fonts"]
lint = { enabled = true }

[[language]]
name = "typst"
language-servers = ["tinymist"]
rulers = [97, 129]
auto-format = true

[[language]]
name = "markdown"
formatter = { command = "prettier", args = [
  "--parser=markdown",
  "--prose-wrap=preserve",
] }
rulers = [97, 129]
auto-format = true

# 需要 bash-language-server
# 并且需要安装 shfmt 与 shellcheck
[language-server.bash-language-server.config]
bashIde = { shellcheckArguments = ["--shell=bash"] }

[[language]]
name = "bash"
language-servers = ["bash-language-server"]
formatter = { command = "shfmt", args = ["--indent=2"] }
auto-format = true

# 需要使用 cargo install --lock --features lsp taplo-cli 来安装
[[language]]
name = "toml"
language-servers = ["taplo"]
formatter = { command = "taplo", args = ["format", "-"] }
auto-format = true

[[language]]
name = "yaml"
formatter = { command = "prettier", args = ["--parser", "yaml"] }
auto-format = true
